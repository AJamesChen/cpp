name: Clang Tidy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF

      - name: Run clang-tidy
        run: clang-tidy -p build src/codility/binary_gap.cpp
